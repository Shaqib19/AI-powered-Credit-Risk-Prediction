<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Credit Risk Platform</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="page">

    <!-- LEFT HERO -->
    <div class="hero">
      <img src="images/image_1.jpg" alt="Banking AI">
      <h1>AI-Powered Credit Risk Platform</h1>
      <p>Smarter loan approvals for modern banks</p>
    </div>

    <!-- RIGHT LOGIN -->
    <div class="auth">
      <div class="auth-card">
        <h2>🏦 Bank Login</h2>

        <input id="email" type="email" placeholder="Bank Email" />
        <input id="password" type="password" placeholder="Password" />

        <button onclick="login()">Login</button>

        <p class="link">
          New bank?
          <a href="register.html">Register here</a>
        </p>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
