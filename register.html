<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register Bank</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="page">

    <!-- LEFT HERO -->
    <div class="hero">
      <img src="images/image_2.jpg" alt="Register Bank">
      <h1>Secure Bank Registration</h1>
      <p>Join the AI-powered credit risk ecosystem</p>
    </div>

    <!-- RIGHT REGISTER -->
    <div class="auth">
      <div class="auth-card">
        <h2>🏦 Register Bank</h2>

        <input id="email" type="email" placeholder="Official Bank Email" />
        <input id="password" type="password" placeholder="Password" />

        <button onclick="register()">Create Account</button>

        <p class="link">
          Already registered?
          <a href="index.html">Login</a>
        </p>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
